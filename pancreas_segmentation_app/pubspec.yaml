name: pancreas_segmentation_app
description: A Flutter app for pancreas tumor segmentation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Material Design icons
  cupertino_icons: ^1.0.6

  # Image picking from gallery/camera
  image_picker: ^1.0.7

  # File picker for desktop
  file_picker: ^10.0.0

  # Image processing
  image: ^4.1.7

  # Path utilities
  path_provider: ^2.1.2
  path: ^1.8.3

  # State management
  provider: ^6.1.1
  
  # HTTP client
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
